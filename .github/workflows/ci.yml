name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            check: true
          - os: windows-latest
            check: false
          - os: macos-latest
            check: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Package tests
        run: node --test npm/test/prepare-publish.test.mjs npm/test/rom-bin.test.cjs

      - name: Format
        if: matrix.check
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        if: matrix.check
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
