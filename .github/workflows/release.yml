# Builds rom for the platforms npm can install, attaches the binaries to a
# GitHub Release, and publishes the rom-cli packages.
#
# One-time setup before the first tag:
#   1. Create an npm account.
#   2. npmjs.com → Access Tokens → Granular Access Token.
#      Permissions: read and write packages. Turn off the 2FA requirement
#      for this token so Actions can use it. Packages do not exist yet, so
#      allow all packages on the account.
#   3. GitHub → Settings → Secrets and variables → Actions → NPM_TOKEN.
#   4. Push this workflow to main, then tag. The tag must be the commit that
#      contains this file, and it must match workspace.package.version.
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# workflow_dispatch builds the binaries and uploads artifacts. It does not
# publish. Use it to check the build before tagging.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rom-win32-x64
            binary: rom.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: rom-linux-x64
            binary: rom
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: rom-linux-arm64
            binary: rom
            musl: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p rom

      - name: Smoke test
        shell: bash
        run: ./target/${{ matrix.target }}/release/${{ matrix.binary }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Cargo.toml
        run: |
          set -euo pipefail
          version=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          tag="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml ${version}, tag ${tag}"
          test "$version" = "$tag"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: rom-*

      - name: Pack npm packages and checksums
        run: node npm/prepare-publish.mjs --version "${GITHUB_REF_NAME#v}" --artifacts artifacts --out npm/dist

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" npm/dist/assets/* --clobber
          else
            gh release create "$tag" npm/dist/assets/* --title "$tag" --generate-notes
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is not set. The GitHub Release exists. Add the secret and re-run this job."
            exit 1
          fi
          npm whoami
          publish() {
            local dir="$1"
            if npm publish "$dir" --access public --provenance; then
              return 0
            fi
            local name version
            name=$(node -p "require('./${dir}/package.json').name")
            version=$(node -p "require('./${dir}/package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already on npm"
              return 0
            fi
            return 1
          }
          for dir in npm/dist/rom-cli-*; do
            publish "$dir"
          done
          publish npm/dist/rom-cli
